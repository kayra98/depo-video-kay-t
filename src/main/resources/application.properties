spring.application.name=vk

# Server
server.port=8443

# SSL/HTTPS
server.ssl.key-store=classpath:vk-keystore.p12
server.ssl.key-store-password=vk12345
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=vk

# PostgreSQL (Docker container on port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/vk
spring.datasource.username=${DB_USERNAME:vk}
spring.datasource.password=${DB_PASSWORD:vk_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis (Docker container on port 6380)
spring.data.redis.host=localhost
spring.data.redis.port=6380

# Session (Redis-backed)
spring.session.store-type=redis
spring.session.timeout=30m
spring.session.redis.flush-mode=on_save
spring.session.redis.repository-type=default
spring.session.redis.namespace=spring:session:vk

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# File upload (for video uploads)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Camera (USB/webcam device number, e.g. 0 for /dev/video0)
camera.device=0

# Video storage
storage.local.path=./recordings
storage.local.max-percent=80

# Bunny S3 (override via StorageConfig in DB)
storage.s3.enabled=false
storage.s3.endpoint=https://storage.bunnycdn.com
storage.s3.region=de
storage.s3.bucket=
storage.s3.access-key=
storage.s3.secret-key=
storage.s3.retention-days=30

# Logging
logging.level.com.kayra.vk=DEBUG
logging.level.org.springframework.security=INFO
